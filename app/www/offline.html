<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연결 없음 · 통합과학 lab</title>
<style>
  :root { --ink: #1a1a1a; --muted: #5e6670; --accent: #2c6852; --bg: #f3f1ec; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e8ecf1; --muted: #a3acb8; --accent: #6fb79a; --bg: #12161c; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
         font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all;
         padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { max-width: 320px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.6; }
  button { font: inherit; font-size: 16px; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 10px;
           padding: 12px 28px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>와이파이나 데이터 연결을 확인한 뒤 다시 시도하세요.</p>
  <button type="button" onclick="location.href='https://lab.jth4377.synology.me/'">다시 시도</button>
</main>
</body>
</html>
