<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구조</title>
<script src="./support.js"></script>
<script src="/_blob/d683fbc00c3971b9761dbfc2cb0d328a"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; background: #070a10; }
    a { color: #54EBE0; } a:hover { color: #BD8CFC; }
  </style>
</helmet>
<div style="width: 1305px; height: 420px; position: relative; overflow: hidden; background: #070a10;">
  <canvas ref="{{bind}}" width="1305" height="420" style="position: absolute; left: 0px; top: 0px; width: 1305px; height: 420px; display: block; cursor: grab; touch-action: none;"></canvas>
  <sc-if value="{{showGuides}}" hint-placeholder-val="{{true}}">
    <sc-if value="{{lightTheme}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0px; top: 0px; width: 1305px; height: 420px; pointer-events: none;">
      <div style="position: absolute; left: 150px; bottom: 18px; width: 180px; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: rgba(22,24,38,0.50);">정육면체</div>
      <div style="position: absolute; left: 470px; bottom: 18px; width: 320px; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: rgba(22,24,38,0.50);">비틀리며 갈라지는 띠</div>
      <div style="position: absolute; left: 930px; bottom: 18px; width: 260px; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: rgba(22,24,38,0.50);">결정</div>
      <div style="position: absolute; left: 42px; top: 14px; font-size: 11px; letter-spacing: 0.28em; color: rgba(22,24,38,0.50);">구조 — 정육면체 · 띠 · 결정</div>
      </div>
    </sc-if>
    <sc-if value="{{darkTheme}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0px; top: 0px; width: 1305px; height: 420px; pointer-events: none;">
      <div style="position: absolute; left: 150px; bottom: 18px; width: 180px; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: rgba(255,255,255,0.42);">정육면체</div>
      <div style="position: absolute; left: 470px; bottom: 18px; width: 320px; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: rgba(255,255,255,0.42);">비틀리며 갈라지는 띠</div>
      <div style="position: absolute; left: 930px; bottom: 18px; width: 260px; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: rgba(255,255,255,0.42);">결정</div>
      <div style="position: absolute; left: 42px; top: 14px; font-size: 11px; letter-spacing: 0.28em; color: rgba(255,255,255,0.42);">구조 — 정육면체 · 띠 · 결정</div>
      </div>
    </sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"1 배경"},"accentA":{"editor":"color","default":"#54EBE0","options":["#54EBE0","#7FD9F2","#8AEFD0","#A8E4FF"],"section":"2 컬러"},"accentB":{"editor":"color","default":"#BD8CFC","options":["#BD8CFC","#A78BFA","#D8A8F0","#8FA6F7"],"section":"2 컬러"},"accentC":{"editor":"color","default":"#52E6CC","options":["#52E6CC","#7FD9F2","#C9B6FA","#FFFFFF"],"section":"2 컬러"},"twist":{"editor":"range","min":0,"max":2,"step":0.05,"default":0.9,"section":"3 띠"},"splits":{"editor":"int","min":2,"max":5,"step":1,"default":3,"section":"3 띠"},"slotW":{"editor":"range","min":0,"max":0.9,"step":0.02,"default":0.66,"section":"3 띠"},"thick":{"editor":"range","min":0.6,"max":1.5,"step":0.02,"default":1,"section":"3 띠"},"crystalSize":{"editor":"range","min":0.3,"max":1.1,"step":0.02,"default":0.6,"section":"4 결정"},"crystalScale":{"editor":"range","min":1.8,"max":3,"step":0.05,"default":2.2,"section":"4 결정"},"crystalBase":{"editor":"range","min":0.9,"max":1.5,"step":0.02,"default":1.26,"section":"4 결정"},"crystalRot":{"editor":"range","min":0,"max":1.2,"step":0.01,"default":0.45,"section":"4 결정"},"yaw":{"editor":"range","min":-70,"max":70,"step":1,"default":0,"unit":"deg","section":"5 카메라"},"pitch":{"editor":"range","min":-50,"max":50,"step":1,"default":6,"unit":"deg","section":"5 카메라"},"zoom":{"editor":"range","min":0.7,"max":1.5,"step":0.02,"default":1,"section":"5 카메라"},"autoSpin":{"editor":"boolean","default":false,"section":"5 카메라"},"showGuides":{"editor":"boolean","default":true,"section":"6 판형 가이드"},"$preview":{"width":1305,"height":420}}'>
class Component extends DCLogic {
  opts() {
    return {
      view: 'strip',
      theme: this.props.theme ?? 'dark',
      accentA: this.props.accentA ?? '#54EBE0',
      accentB: this.props.accentB ?? '#BD8CFC',
      accentC: this.props.accentC ?? '#52E6CC',
      twist: this.props.twist ?? 0.9,
      splits: this.props.splits ?? 3,
      slotW: this.props.slotW ?? 0.66,
      thick: this.props.thick ?? 1,
      crystalSize: this.props.crystalSize ?? 0.6,
      crystalScale: this.props.crystalScale ?? 2.2,
      crystalBase: this.props.crystalBase ?? 1.26,
      crystalRot: this.props.crystalRot ?? 0.45,
      yaw: this.props.yaw ?? 0,
      pitch: this.props.pitch ?? 6,
      zoom: this.props.zoom ?? 1,
      autoSpin: this.props.autoSpin ?? false
    };
  }
  componentDidUpdate() { if (this.seq) this.seq.update(this.opts()); }
  componentWillUnmount() { if (this.seq) { this.seq.destroy(); this.seq = null; } }
  attach(el) {
    if (!el) return;
    if (this.seq && this.el === el) return;
    if (this.seq) this.seq.destroy();
    this.el = el;
    if (window.SEQ3D) {
      this.seq = window.SEQ3D.mount(el, this.opts());
    } else {
      var self = this;
      setTimeout(function () {
        if (window.SEQ3D && !self.seq) self.seq = window.SEQ3D.mount(el, self.opts());
      }, 400);
    }
  }
  renderVals() {
    var self = this;
    var theme = this.props.theme ?? 'dark';
    return {
      bind: function (el) { self.attach(el); },
      showGuides: this.props.showGuides ?? true,
      lightTheme: theme === 'light',
      darkTheme: theme !== 'light'
    };
  }
}
</script>
</body>
</html>
