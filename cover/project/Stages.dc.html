<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>진화 단계</title>
<script src="./support.js"></script>
<script src="/_blob/8047aa5763fa81ac5dfa6ea043fe2937"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; background: #05060a; }
    a { color: #66EDDE; } a:hover { color: #B891FC; }
  </style>
</helmet>
<div style="width: 1305px; height: 360px; position: relative; overflow: hidden; background: #05060a;">
  <canvas ref="{{bind}}" width="1305" height="360" style="position: absolute; left: 0px; top: 0px; width: 1305px; height: 360px; display: block; cursor: grab; touch-action: none;"></canvas>
  <sc-if value="{{showGuides}}" hint-placeholder-val="{{true}}">
    <sc-if value="{{lightTheme}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0px; top: 0px; width: 1305px; height: 360px; pointer-events: none;">
      <div style="position: absolute; left: 82.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(22,24,38,0.50);">01</div>
      <div style="position: absolute; left: 262.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(22,24,38,0.50);">02</div>
      <div style="position: absolute; left: 442.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(22,24,38,0.50);">03</div>
      <div style="position: absolute; left: 622.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(22,24,38,0.50);">04</div>
      <div style="position: absolute; left: 802.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(22,24,38,0.50);">05</div>
      <div style="position: absolute; left: 982.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(22,24,38,0.50);">06</div>
      <div style="position: absolute; left: 1162.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(22,24,38,0.50);">07</div>
      <div style="position: absolute; left: 42px; top: 14px; font-size: 11px; letter-spacing: 0.28em; color: rgba(22,24,38,0.50);">정육면체 → 눈 결정 · 7단계</div>
      </div>
    </sc-if>
    <sc-if value="{{darkTheme}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0px; top: 0px; width: 1305px; height: 360px; pointer-events: none;">
      <div style="position: absolute; left: 82.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.42);">01</div>
      <div style="position: absolute; left: 262.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.42);">02</div>
      <div style="position: absolute; left: 442.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.42);">03</div>
      <div style="position: absolute; left: 622.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.42);">04</div>
      <div style="position: absolute; left: 802.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.42);">05</div>
      <div style="position: absolute; left: 982.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.42);">06</div>
      <div style="position: absolute; left: 1162.5px; bottom: 18px; width: 60px; text-align: center; font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.42);">07</div>
      <div style="position: absolute; left: 42px; top: 14px; font-size: 11px; letter-spacing: 0.28em; color: rgba(255,255,255,0.42);">정육면체 → 눈 결정 · 7단계</div>
      </div>
    </sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"1 배경"},"accentA":{"editor":"color","default":"#66EDDE","options":["#66EDDE","#8FD8F5","#A6F0CE","#B9E6FF"],"section":"2 컬러"},"accentB":{"editor":"color","default":"#B891FC","options":["#B891FC","#A78BFA","#DCB8F2","#93A9F7"],"section":"2 컬러"},"glow":{"editor":"range","min":0,"max":2,"step":0.05,"default":1,"section":"2 컬러"},"stages":{"editor":"int","min":3,"max":9,"step":1,"default":7,"section":"3 진화"},"twist":{"editor":"range","min":0,"max":1.8,"step":0.05,"default":1,"section":"3 진화"},"spin":{"editor":"range","min":0,"max":2.5,"step":0.05,"default":0.35,"section":"3 진화"},"fuse":{"editor":"range","min":0.01,"max":0.5,"step":0.01,"default":0.02,"section":"3 진화"},"yaw":{"editor":"range","min":-75,"max":75,"step":1,"default":0,"unit":"deg","section":"4 카메라"},"pitch":{"editor":"range","min":-50,"max":50,"step":1,"default":0,"unit":"deg","section":"4 카메라"},"zoom":{"editor":"range","min":0.6,"max":1.6,"step":0.02,"default":1,"section":"4 카메라"},"autoSpin":{"editor":"boolean","default":false,"section":"4 카메라"},"showGuides":{"editor":"boolean","default":true,"section":"5 판형 가이드"},"$preview":{"width":1305,"height":360}}'>
class Component extends DCLogic {
  opts() {
    return {
      layout: 'strip',
      theme: this.props.theme ?? 'dark',
      accentA: this.props.accentA ?? '#66EDDE',
      accentB: this.props.accentB ?? '#B891FC',
      glow: this.props.glow ?? 1,
      stages: this.props.stages ?? 7,
      twist: this.props.twist ?? 1,
      spin: this.props.spin ?? 0.35,
      fuse: this.props.fuse ?? 0.02,
      yaw: this.props.yaw ?? 0,
      pitch: this.props.pitch ?? 0,
      zoom: this.props.zoom ?? 1,
      autoSpin: this.props.autoSpin ?? false
    };
  }
  componentDidUpdate() {
    if (this.seq) this.seq.update(this.opts());
  }
  componentWillUnmount() {
    if (this.seq) { this.seq.destroy(); this.seq = null; }
  }
  attach(el) {
    if (!el) return;
    if (this.seq && this.el === el) return;
    if (this.seq) this.seq.destroy();
    this.el = el;
    if (window.SEQ3D) {
      this.seq = window.SEQ3D.mount(el, this.opts());
    } else {
      var self = this;
      setTimeout(function () {
        if (window.SEQ3D && !self.seq) self.seq = window.SEQ3D.mount(el, self.opts());
      }, 400);
    }
  }
  renderVals() {
    var self = this;
    var theme = this.props.theme ?? 'dark';
    return {
      bind: function (el) { self.attach(el); },
      showGuides: this.props.showGuides ?? true,
      lightTheme: theme === 'light',
      darkTheme: theme !== 'light'
    };
  }
}
</script>
</body>
</html>
