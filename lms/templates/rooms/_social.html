{# 순위 한 줄 (소도시 명상 화면들이 함께 쓴다) #}
{% macro rank_row(r, me) -%}
<li class="rank-row{{ ' is-me' if r.id == me }}{{ ' is-king' if r.rank == 1 }}">
  <span class="rank-no">{% if r.rank == 1 %}<svg class="crown" viewBox="0 0 24 24" aria-label="1위"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>{% else %}{{ r.rank }}{% endif %}</span>
  <i class="rank-dot {{ r.avatar_color|avatar_cls }}" aria-hidden="true"></i>
  <b class="rank-nick">{{ r.nickname or '익명' }}{% if r.id == me %} <small>(나)</small>{% endif %}</b>
  <span class="rank-m">{{ r.m|hm }}</span>
</li>
{%- endmacro %}
