{% extends "base.html" %}
{% block title %}로그인 · 정태혁 통합과학 lab{% endblock %}
{% block main_class %}auth-wrap{% endblock %}
{% block content %}
<div class="card">
  <h1>로그인</h1>
  <form method="post" autocomplete="on" data-enter>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn primary" type="submit">로그인</button>
  </form>
  {% if google_enabled() %}
  <a class="btn google-btn" href="{{ url_for('google.start', mode='login') }}">Google 계정으로 로그인</a>
  <p class="small muted">Google 계정을 연결한 학생만</p>
  {% endif %}
  <p class="small mt"><a href="{{ url_for('auth.signup') }}">학생 회원가입</a> (선생님께 받은 개인 코드 필요)</p>
</div>
{% endblock %}
