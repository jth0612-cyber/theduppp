{% extends "base.html" %}
{% block title %}로그인 · 학습 관리{% endblock %}
{% block main_class %}auth-wrap{% endblock %}
{% block content %}
<div class="card">
  <h1>학습 관리</h1>
  <p class="muted small">강사·조교는 발급받은 아이디로, 학생은 수험번호로 로그인하세요.</p>
  <form method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn primary" type="submit">로그인</button>
  </form>
  <p class="small mt">처음이에요? <a href="{{ url_for('auth.signup') }}">학생 회원가입</a> (반 가입 코드 필요)</p>
</div>
{% endblock %}
