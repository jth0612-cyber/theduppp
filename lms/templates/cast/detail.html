{% extends "base.html" %}
{% block title %}{{ c.title }} · TH캐스트{% endblock %}
{% block content %}
<p class="small"><a href="{{ url_for('cast.cast_list') }}">TH캐스트</a> /</p>
<header class="ed-head ed-head-split">
  <div><h1>{{ c.title }}</h1><p class="ed-lede">정태혁 선생님 · {{ c.created_at[:16] }}</p></div>
  {% if g.user.role == 'teacher' %}<a class="btn" href="{{ url_for('cast.cast_edit', cid=c.id) }}">고치기</a>{% endif %}
</header>
{% if yt %}<div class="cast-video"><iframe src="https://www.youtube-nocookie.com/embed/{{ yt }}" title="{{ c.title }}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>{% endif %}
{% if c.body %}<article class="cast-body pre">{{ c.body }}</article>{% endif %}
{% endblock %}
