{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ s.name }} 학생 임시 비밀번호</h1>
  <div class="notice-box">이 화면은 다시 볼 수 없습니다. 학생에게 직접 전달하세요. 학생은 첫 로그인 때 비밀번호를 바꿔야 합니다.</div>
  <p>아이디<br><span class="secret">{{ username }}</span></p>
  <p>임시 비밀번호<br><span class="secret">{{ temp }}</span></p>
  <a class="btn primary" href="{{ url_for('teacher.student_detail', sid=s.id) }}">확인했습니다</a>
</div>
{% endblock %}
