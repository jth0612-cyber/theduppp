{% extends "base.html" %}
{% block content %}
<div class="card">

  <div class="notice-box">이 화면은 다시 볼 수 없습니다. 조교에게 직접 전달하세요. 첫 로그인 때 비밀번호를 바꿔야 합니다.</div>
  <p>아이디<br><span class="secret">{{ username }}</span></p>
  <p>임시 비밀번호<br><span class="secret">{{ temp }}</span></p>
  <a class="btn primary" href="{{ url_for('teacher.staff') }}">확인했습니다</a>
</div>
{% endblock %}
