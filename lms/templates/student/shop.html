{% extends "base.html" %}
{% block title %}교재 구매 · 정태혁 통합과학 lab{% endblock %}
{% block content %}
<header class="ed-head">
  <h1>교재 구매</h1>
</header>
<ul class="shop-list">
  {% for b in books %}
  <li class="shop-item">
    <img src="{{ url_for('static', filename='img/books/' ~ b.key ~ '-cover-720.webp') }}" width="720" height="480" loading="lazy" alt="{{ b.alt }}">
    <div class="shop-meta">
      <div><b>{{ b.name }}</b><span>{{ b.sub }}</span></div>
      {% if b.url %}<a class="btn primary" href="{{ b.url }}" target="_blank" rel="noopener noreferrer">구매하기<span class="sr-only"> {{ b.name }} (새 창)</span></a>
      {% else %}<span class="shop-wait">준비 중</span>{% endif %}
    </div>
  </li>
  {% endfor %}
</ul>
<p class="small muted">구매·배송·환불은 판매처 담당입니다.</p>
{% endblock %}
