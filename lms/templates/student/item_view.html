{% extends "base.html" %}
{% block title %}{{ label }} {{ no }}번 | 정태혁 통합과학 lab{% endblock %}
{% block content %}
<div class="page-head">
  <div><p class="small"><a href="{{ url_for('books.analysis_home', mock=m.id) }}">시험 분석</a> /</p><h1>{{ label }} {{ no }}번</h1></div>
</div>
<figure class="item-figure"><img src="{{ url_for('items.image', mid=m.id, no=no) }}" alt="{{ label }} {{ no }}번 문항" draggable="false"></figure>
<div class="item-actions">
  {% if prev %}<a class="btn" href="{{ url_for('items.view', mid=m.id, no=prev) }}" aria-label="{{ prev }}번 문항">← {{ prev }}번</a>{% else %}<span></span>{% endif %}
  <a class="btn primary" href="{{ url_for('student.questions', ask=1, mock=m.id, item=no) }}#ask">이 문항에 필기해서 질문</a>
  {% if next %}<a class="btn" href="{{ url_for('items.view', mid=m.id, no=next) }}" aria-label="{{ next }}번 문항">{{ next }}번 →</a>{% else %}<span></span>{% endif %}
</div>
{% endblock %}
