{% extends "base.html" %}
{% block title %}비밀번호 변경 · 정태혁 통합과학 lab{% endblock %}
{% block main_class %}auth-wrap{% endblock %}
{% block content %}
<div class="card">
  <h1>비밀번호 변경</h1>
  {% if g.user.must_change_pw %}
    <div class="notice-box small">임시 비밀번호로 로그인했습니다. 계속하려면 새 비밀번호를 정하세요.</div>
  {% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current">현재 비밀번호</label>
      <input type="password" id="current" name="current" required autocomplete="current-password">
    </div>
    <div class="field">
      <label for="new">새 비밀번호 (10자 이상, 영문·숫자·특수문자 중 2종류 이상)</label>
      <input type="password" id="new" name="new" required minlength="10" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">새 비밀번호 확인</label>
      <input type="password" id="confirm" name="confirm" required minlength="10" autocomplete="new-password">
    </div>
    <button class="btn primary" type="submit">변경</button>
  </form>
  {% if g.user.must_change_pw %}
  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="small"><button class="btn link">로그아웃</button></p>
  </form>
  {% endif %}
</div>
{% endblock %}
