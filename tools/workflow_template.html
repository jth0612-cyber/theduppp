<title>통합과학 lab 작동 흐름</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* 캔버스: 흐름 하나 = 가로 한 줄, 카드(화면) → 화살표 → 카드. 역할 색은 머리 띠에만 */
:root {
  --bg: #F3F5F8; --dot: #D6DFEB; --card: #FFFFFF; --ink: #1A1A1A; --muted: #5E6670; --line: #8EA6C8; --edge: #D6DFEB;
  --head: #1F3A5F; --panel: #FFFFFFEE; --shadow: 0 1px 2px #1f3a5f14, 0 6px 18px #1f3a5f12;
  --stu: #3B7F4A; --stu-bg: #EEF6EF; --ta: #1F5AA6; --ta-bg: #E9EFF7; --tea: #9A4A12; --tea-bg: #FDF6EE; --par: #5B3A8C; --par-bg: #F7F4FB;
  --font: "Nanum Gothic", "NanumBarunGothic", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161C; --dot: #263140; --card: #1A2029; --ink: #E8ECF1; --muted: #A3ACB8; --line: #5D7699; --edge: #2C3644;
  --head: #C9D7EA; --panel: #1A2029EE; --shadow: 0 1px 2px #0006, 0 6px 18px #0005;
  --stu: #7FC28E; --stu-bg: #1C2A20; --ta: #8FB4E8; --ta-bg: #1B2533; --tea: #F0A877; --tea-bg: #2E2219; --par: #C1A8E6; --par-bg: #261F33; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161C; --dot: #263140; --card: #1A2029; --ink: #E8ECF1; --muted: #A3ACB8; --line: #5D7699; --edge: #2C3644;
  --head: #C9D7EA; --panel: #1A2029EE; --shadow: 0 1px 2px #0006, 0 6px 18px #0005;
  --stu: #7FC28E; --stu-bg: #1C2A20; --ta: #8FB4E8; --ta-bg: #1B2533; --tea: #F0A877; --tea-bg: #2E2219; --par: #C1A8E6; --par-bg: #261F33; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; word-break: keep-all; }
#view { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 24px 24px; }
#view.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke: var(--line); stroke-width: 2.2; }
#links .tip { fill: var(--line); stroke: none; }
.flow-head { position: absolute; width: 250px; }
.flow-head h2 { margin: 0 0 8px; font-size: 26px; line-height: 1.3; font-weight: 800; color: var(--head); text-wrap: balance; }
.flow-head p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted); }
.flow-head .n { display: inline-block; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin-bottom: 6px; }
.card { position: absolute; width: 440px; background: var(--card); border: 1px solid var(--edge); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.card header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 15px; font-weight: 800; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; flex: none; }
.r-학생 header { background: var(--stu-bg); } .r-학생 .chip { color: var(--stu); border: 1px solid var(--stu); }
.r-조교 header { background: var(--ta-bg); } .r-조교 .chip { color: var(--ta); border: 1px solid var(--ta); }
.r-선생님 header { background: var(--tea-bg); } .r-선생님 .chip { color: var(--tea); border: 1px solid var(--tea); }
.r-학부모 header { background: var(--par-bg); } .r-학부모 .chip { color: var(--par); border: 1px solid var(--par); }
.card .shot { display: block; width: 100%; aspect-ratio: 1280 / 714; object-fit: cover; object-position: top; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
  cursor: zoom-in; background: var(--bg); }
.card p { margin: 0; padding: 10px 12px 12px; font-size: 14px; line-height: 1.55; color: var(--ink); }
.step { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
#bar { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; pointer-events: none; z-index: 5; }
.panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.panel h1 { margin: 0 8px 0 6px; font-size: 16px; font-weight: 800; color: var(--head); }
button, select { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--edge); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--line); }
button:focus-visible, select:focus-visible, .shot:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
#zoomv { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.legend { display: flex; gap: 6px; padding: 0 4px; }
#lb { position: fixed; inset: 0; background: #0b1018e6; display: flex; align-items: flex-start; justify-content: center; z-index: 10; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
#lb figure { margin: auto 0; max-width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
#lb img { width: min(1600px, 100%); height: auto; border-radius: 8px; box-shadow: 0 10px 40px #0008; }
#lb figcaption { order: -1; position: sticky; top: 0; background: #0b1018e6; padding: 8px 12px; border-radius: 8px; color: #F3F5F8; font-size: 16px; text-align: center; max-width: 70ch; line-height: 1.5; }
@media (max-width: 640px) { .legend { display: none; } .panel h1 { font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { #world { transition: none !important; } }
</style>

<div id="view" aria-label="작동 흐름 캔버스"><div id="world"><svg id="links" aria-hidden="true"></svg></div></div>
<div id="bar">
  <div class="panel"><h1>통합과학 lab 작동 흐름</h1>
    <select id="jump" aria-label="흐름으로 이동"><option value="">흐름 고르기</option></select>
  </div>
  <div class="panel">
    <span class="legend" aria-hidden="true">
      <span class="chip" style="color:var(--stu);border:1px solid var(--stu)">학생</span>
      <span class="chip" style="color:var(--ta);border:1px solid var(--ta)">조교</span>
      <span class="chip" style="color:var(--tea);border:1px solid var(--tea)">선생님</span>
      <span class="chip" style="color:var(--par);border:1px solid var(--par)">학부모</span>
    </span>
    <button id="zout" type="button" aria-label="축소">−</button>
    <span id="zoomv">100%</span>
    <button id="zin" type="button" aria-label="확대">+</button>
    <button id="fit" type="button">전체 보기</button>
  </div>
</div>
<div id="lb" hidden><figure><img alt=""><figcaption></figcaption></figure></div>

<script>
const DATA = /*DATA*/null;
const CW = 440, GAP = 64, HEAD = 300, ROWGAP = 90, PAD = 80;
const world = document.getElementById("world"), view = document.getElementById("view"), svg = document.getElementById("links");
const rows = [];
const y = PAD; let maxX = 0;   // 줄 높이는 그린 뒤 layout()에서 잰다
DATA.forEach((f, i) => {
  const h = document.createElement("div"); h.className = "flow-head"; h.style.left = PAD + "px"; h.style.top = y + "px";
  h.innerHTML = `<span class="n">흐름 ${i + 1}</span><h2></h2><p></p>`;
  h.querySelector("h2").textContent = f.title; h.querySelector("p").textContent = f.sub; world.appendChild(h);
  const cards = [], col = [];
  f.steps.forEach((s, k) => {
    const from = s.from == null ? k - 1 : s.from; col[k] = from < 0 ? 0 : col[from] + 1;
    const c = document.createElement("article"); c.className = "card r-" + s.role;
    c.style.left = (PAD + HEAD + col[k] * (CW + GAP)) + "px"; c.dataset.col = col[k]; c.dataset.from = from; c.style.top = y + "px";
    c.innerHTML = `<header><span class="chip"></span><span class="step">${s.no || k + 1}</span><span class="t"></span></header><img class="shot" tabindex="0" loading="lazy" alt=""><p></p>`;
    c.querySelector(".chip").textContent = s.role; c.querySelector(".t").textContent = s.title; c.querySelector("p").textContent = s.desc;
    const im = c.querySelector("img"); im.src = s.img; im.dataset.full = s.full || s.img; im.alt = `${s.role} 화면: ${s.title}`; im.dataset.cap = `${f.title} · ${s.no || k + 1}. ${s.title} (${s.role}) · ${s.desc}`;
    world.appendChild(c); cards.push(c);
  });
  rows.push({head: h, cards, top: y});
  const opt = document.createElement("option"); opt.value = i; opt.textContent = `${i + 1}. ${f.title}`; document.getElementById("jump").appendChild(opt);
  maxX = Math.max(maxX, PAD + HEAD + (Math.max(...col) + 1) * (CW + GAP));
});

function layout() {
  let yy = PAD;
  rows.forEach(r => {
    r.top = yy; r.head.style.top = yy + "px";
    const fill = {};   // 열마다 쌓인 높이
    r.cards.forEach(c => { const k = c.dataset.col, t = fill[k] || 0; c.style.top = (yy + t) + "px"; fill[k] = t + c.offsetHeight + 34; });
    const h = Math.max(r.head.offsetHeight, ...Object.values(fill).map(v => v - 34)); r.h = h; yy += h + ROWGAP;
  });
  const W = maxX + PAD, H = yy - ROWGAP + PAD;
  world.style.width = W + "px"; world.style.height = H + "px";
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  let d = "";
  rows.forEach(r => r.cards.forEach((c, k) => {
    const f = +c.dataset.from; if (f < 0) return;
    const a = r.cards[f], x1 = a.offsetLeft + a.offsetWidth + 6, x2 = c.offsetLeft - 8, y1 = a.offsetTop + 160, y2 = c.offsetTop + 160;
    const m = (x1 + x2) / 2;
    d += y1 === y2 ? `<path d="M${x1} ${y1} L${x2 - 10} ${y2}"/>` : `<path d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2 - 10} ${y2}"/>`;
    d += `<path class="tip" d="M${x2} ${y2} l-12 -6 v12 z"/>`;
  }));
  svg.innerHTML = d;
  return {W, H};
}

let s = 1, tx = 0, ty = 0, size = {W: 1, H: 1};
const zv = document.getElementById("zoomv");
function apply(anim) {
  world.style.transition = anim ? "transform .28s ease" : "none";
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  zv.textContent = Math.round(s * 100) + "%";
  view.style.backgroundSize = `${24 * s}px ${24 * s}px`; view.style.backgroundPosition = `${tx}px ${ty}px`;
}
function zoomAt(f, cx, cy, anim) {
  const ns = Math.min(3, Math.max(0.08, s * f));
  tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); s = ns; apply(anim);
}
function fitTo(x, y0, w, h, anim, top) {
  const vw = view.clientWidth, vh = view.clientHeight - 70;
  s = Math.min(3, Math.max(0.08, Math.min(vw / w, vh / h) * 0.95));
  tx = (vw - w * s) / 2 - x * s; ty = 70 + (top ? 10 : (vh - h * s) / 2) - y0 * s; apply(anim);
}
const fitAll = anim => fitTo(0, 0, size.W, size.H, anim);

view.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY); }, {passive: false});
const pts = new Map(); let last = null, pinch = null, moved = 0;
view.addEventListener("pointerdown", e => { pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); moved = 0;
  if (pts.size === 1) { last = {x: e.clientX, y: e.clientY}; view.classList.add("drag"); }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y)}; } });
view.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch.d = d; moved += 10; return; }
  if (last) { const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4) { view.setPointerCapture(e.pointerId); tx += dx; ty += dy; apply(); } last = {x: e.clientX, y: e.clientY}; } });
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { last = null; view.classList.remove("drag"); } };
view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);

const lb = document.getElementById("lb");
function openShot(im) { lb.querySelector("img").src = im.dataset.full; lb.scrollTop = 0; lb.querySelector("img").alt = im.alt; lb.querySelector("figcaption").textContent = im.dataset.cap; lb.hidden = false; }
world.addEventListener("click", e => { const im = e.target.closest(".shot"); if (im && moved < 6) openShot(im); });
world.addEventListener("keydown", e => { const im = e.target.closest(".shot"); if (im && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openShot(im); } });
lb.addEventListener("click", () => { lb.hidden = true; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") lb.hidden = true;
  if (!lb.hidden || e.target.tagName === "SELECT") return;
  const cx = view.clientWidth / 2, cy = view.clientHeight / 2;
  if (e.key === "+" || e.key === "=") zoomAt(1.25, cx, cy, true);
  if (e.key === "-") zoomAt(0.8, cx, cy, true);
  if (e.key === "0") fitAll(true);
  const st = 80; if (e.key === "ArrowLeft") { tx += st; apply(); } if (e.key === "ArrowRight") { tx -= st; apply(); }
  if (e.key === "ArrowUp") { ty += st; apply(); } if (e.key === "ArrowDown") { ty -= st; apply(); } });
document.getElementById("zin").onclick = () => zoomAt(1.25, view.clientWidth / 2, view.clientHeight / 2, true);
document.getElementById("zout").onclick = () => zoomAt(0.8, view.clientWidth / 2, view.clientHeight / 2, true);
document.getElementById("fit").onclick = () => fitAll(true);
document.getElementById("jump").onchange = e => { const r = rows[+e.target.value]; if (!r) return;
  const right = Math.max(...r.cards.map(c => c.offsetLeft + c.offsetWidth)); fitTo(PAD - 20, r.top - 20, right - PAD + 40, r.h + 40, true, true); e.target.value = ""; };

function boot() { size = layout(); fitAll(false); }
boot();
let imgsLeft = world.querySelectorAll("img").length;
world.querySelectorAll("img").forEach(im => im.addEventListener("load", () => { if (--imgsLeft === 0) size = layout(); }, {once: true}));
addEventListener("resize", () => fitAll(false));
</script>
