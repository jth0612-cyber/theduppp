<style>
/* 레이아웃: 목업 배경과 같은 어두운 바닥 위에 표지 카드 그리드. 표지 위 제목만 폰트별로 바뀐다. */
:root {
  --ground: #1f1f1f;
  --panel: #2a2a2c;
  --line: #3a3a3e;
  --ink: #ececee;
  --muted: #9a9aa2;
  --blue: #6095cb;
  --purple: #8a7fb7;
  --tone: var(--blue);
  --pick: #e9d27a;
  --ui: "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
:root.vol2 { --tone: var(--purple); }
body { background: var(--ground); color: var(--ink); font-family: var(--ui); }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
header { display: grid; gap: 14px; max-width: 72ch; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { font-family: var(--mono); font-weight: 500; color: var(--tone); letter-spacing: 0.04em; }
header p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 0.95rem; }

.picks { display: grid; gap: 10px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.picks h2 { margin: 0; font-size: 0.8rem; font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; color: var(--pick); text-transform: uppercase; }
.picks ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; line-height: 1.6; font-size: 0.92rem; }
.picks b { font-weight: 700; }
.picks small { color: var(--muted); font-size: 0.82rem; }

.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); padding-block: 10px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button, .chips button {
  font: 500 0.82rem var(--ui); color: var(--muted); background: transparent; border: 0;
  padding: 7px 14px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--tone); color: #fff; }
.sets { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.sets button { font: 700 0.95rem var(--ui); color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 4px 2px; cursor: pointer; }
.sets button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--tone); }
.sets small { font: 400 0.75rem var(--mono); margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.chips button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
button:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.count { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); margin-left: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 32px 22px; }
.card { display: grid; gap: 10px; min-width: 0; align-content: start; }
.card button.open { all: unset; cursor: zoom-in; display: block; border-radius: 2px; }
.card button.open:focus-visible { outline: 2px solid var(--pick); outline-offset: 3px; }
.meta { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: baseline; }
.meta .no { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .name { font-weight: 700; font-size: 0.95rem; }
.meta .tag { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; }
.meta .tag.star { color: var(--pick); }
.meta .note { grid-column: 2 / 4; color: var(--muted); font-size: 0.8rem; line-height: 1.55; }

/* 표지 */
.cover {
  container-type: inline-size; position: relative; aspect-ratio: 864 / 1232; max-width: 100%;
  background: #f4f4f4 url(bg-blue.jpg) center / cover no-repeat;
  box-shadow: 0 18px 40px rgba(0,0,0,.45); overflow: hidden;
}
:root.vol2 .cover { background-image: url(bg-purple.jpg); aspect-ratio: 844 / 1232; }
.title {
  /* 글자마다 캡 높이와 베이스라인을 측정해(--fs, --b) 원본과 같은 높이·위치에 놓는다 */
  position: absolute; left: 3.6%; right: 5.2%; top: 0;
  display: flex; justify-content: space-between; align-items: baseline;
  color: var(--tone); font-size: var(--fs, 10cqw); line-height: 1;
  margin-top: calc(13.6cqw - var(--b, 0.9) * 1em);
  white-space: nowrap;
}
.title i { font-style: normal; }
.title .us { display: inline-block; width: var(--bw, 1.1em); height: var(--bar, 0.15em); background: currentColor; }
.title.outline i { color: transparent; -webkit-text-stroke: max(1px, 0.022em) var(--tone); }
.title.outline .us { background: transparent; box-shadow: inset 0 0 0 max(1px, 0.022em) var(--tone); }
.sub { position: absolute; left: 3.6%; top: 11.7%; font: 700 1.6cqw/1.5 var(--ui); color: #3b3b3d; }
.sub span { display: block; font-weight: 400; }

dialog { border: 0; padding: 0; background: transparent; max-width: min(92vw, 560px); width: 100%; }
dialog::backdrop { background: rgba(10,10,12,.82); }
dialog .cover { box-shadow: 0 30px 80px rgba(0,0,0,.6); }
dialog .cap { display: flex; justify-content: space-between; gap: 12px; color: var(--ink); padding-top: 12px; font-size: 0.9rem; }
dialog .cap button { font: 500 0.82rem var(--ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }

footer { color: var(--muted); font-size: 0.82rem; line-height: 1.7; max-width: 72ch; border-top: 1px solid var(--line); padding-top: 18px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } .meta .note { display: none; } .count { margin-left: 0; } }
</style>

</div>

    ["Archivo Black 외곽선", "'Archivo Black'", 400, "라인", "굵은 글자의 외곽선만. 표지 위에 투명하게 얹힘", 0.17, false, null, { fx: "outline" }],

  picks: [

const grid = document.getElementById("grid");
const root = document.documentElement;
let cat = "전체", setNo = 2, FONTS = SETS[2].fonts, base = 30;

function coverHTML(f) {
  const [, family, w, , , bar, , stretch, o = {}] = f;
  const m = f.m || {};
  const st = `font-family:${family}, system-ui, sans-serif;font-weight:${w};${stretch ? `font-stretch:${stretch};` : ""}--bar:${bar}em;${o.bw ? `--bw:${o.bw};` : ""}${m.fs ? `--fs:${m.fs}cqw;--b:${m.b}` : ""}`;
  const L = ["L","I","N","E"].map(c => `<i>${c}</i>`).join("") + `<span class="us"></span>` + ["U","P"].map(c => `<i>${c}</i>`).join("");
  return `<div class="cover"><div class="title${o.fx ? " " + o.fx : ""}" style="${st}" aria-label="LINE_UP">${L}</div>
    <div class="sub">2028학년도<span>대학수학능력시험 대비</span></div></div>`;
}

function render() {
FONTS = SETS[setNo].fonts; base = setNo === 1 ? 0 : 30; cat = "전체";
grid.innerHTML = "";
FONTS.forEach((f, i) => {
  const [name, , w, c, note, , star] = f;
  const el = document.createElement("article");
  el.className = "card"; el.dataset.cat = c; el.dataset.star = star ? "1" : "";
  el.innerHTML = `<button type="button" class="open" aria-label="${name} 크게 보기">${coverHTML(f)}</button>
    <div class="meta"><span class="no">${String(base + i + 1).padStart(2, "0")}</span><span class="name">${name}</span>
    <span class="tag${star ? " star" : ""}">${star ? "추천 · " : ""}${c} ${w}</span><span class="note">${note}</span></div>`;
  el.querySelector(".open").addEventListener("click", () => openDlg(f, i));
  grid.appendChild(el);
});

const chips = document.getElementById("chips");
chips.innerHTML = "";
["전체", "추천", ...new Set(FONTS.map(f => f[3]))].forEach(c => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = c; b.setAttribute("aria-pressed", c === cat);
  b.addEventListener("click", () => { cat = c; chips.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); filter(); });
  chips.appendChild(b);
});
document.getElementById("picks").innerHTML = SETS[setNo].picks.map(([n, no, t]) => `<li><b>${n}</b> <small>(${no})</small> — ${t}</li>`).join("");
document.getElementById("foot").innerHTML = SETS[setNo].foot + " 언더스코어(_)는 원본처럼 막대로 그렸고, 두께는 각 폰트의 획 굵기에 맞췄습니다.";
filter();
measure();
document.getElementById("s1").setAttribute("aria-pressed", setNo === 1);
document.getElementById("s2").setAttribute("aria-pressed", setNo === 2);
}
function filter() {
  let n = 0;
  grid.querySelectorAll(".card").forEach(el => {
    const show = cat === "전체" || (cat === "추천" ? el.dataset.star : el.dataset.cat === cat);
    el.hidden = !show; if (show) n++;
  });
  document.getElementById("count").textContent = `${n} / ${FONTS.length}`;
}

// 폰트마다 캡 높이·글자폭·어센트가 달라서, 로드 뒤 캔버스로 재고 크기와 위치를 맞춘다.
const CAP = 7.2, AVAIL = 91.2 * 0.84;
const ctx = document.createElement("canvas").getContext("2d");
function measure() {
const list = FONTS;
document.fonts.ready.then(() => Promise.all(list.map(f =>
  document.fonts.load(`${f[2]} 100px ${f[1]}`, "LINEUP").catch(() => {})
))).then(() => {
  if (list !== FONTS) return;
  const cards = grid.querySelectorAll(".card .title");
  list.forEach((f, i) => {
    ctx.font = `${f[2]} 100px ${f[1]}, sans-serif`;
    ctx.fontStretch = f[7] ? "expanded" : "normal";
    const t = ctx.measureText("LINEUP");
    const cap = t.actualBoundingBoxAscent / 100, fa = t.fontBoundingBoxAscent / 100, fd = t.fontBoundingBoxDescent / 100;
    if (!cap || !fa) return;
    const widthEm = t.width / 100 + parseFloat((f[8] && f[8].bw) || "1.1");
    const fs = Math.min(CAP / cap, AVAIL / widthEm);
    f.m = { fs: fs.toFixed(2), b: ((1 - fa - fd) / 2 + fa).toFixed(3) };
    cards[i].style.setProperty("--fs", f.m.fs + "cqw");
    cards[i].style.setProperty("--b", f.m.b);
  });
});
}
function setSet(n) { setNo = n; render(); try { history.replaceState(null, "", "#set" + n); } catch (e) {} }
document.getElementById("s1").addEventListener("click", () => setSet(1));
document.getElementById("s2").addEventListener("click", () => setSet(2));
if (location.hash === "#set1") setNo = 1;
render();

const v1 = document.getElementById("v1"), v2 = document.getElementById("v2");
function setVol(two) {
  root.classList.toggle("vol2", two);
  v1.setAttribute("aria-pressed", !two); v2.setAttribute("aria-pressed", two);
  try { localStorage.setItem("lineup-vol", two ? "2" : "1"); } catch (e) {}
}
v1.addEventListener("click", () => setVol(false));
v2.addEventListener("click", () => setVol(true));
try { if (localStorage.getItem("lineup-vol") === "2") setVol(true); } catch (e) {}

const dlg = document.getElementById("dlg");
function openDlg(f, i) {
  document.getElementById("dlg-cover").innerHTML = coverHTML(f);
  document.getElementById("dlg-name").textContent = `${String(base + i + 1).padStart(2, "0")}  ${f[0]} · ${f[2]}`;
  dlg.showModal();
}
document.getElementById("dlg-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
</script>
